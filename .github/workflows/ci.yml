name: ci
# The app's gate: every check here is required on main (see CONTRIBUTING.md).
on:
  pull_request:
    # `edited`: the acceptance-criteria gate reads "Closes #n" from the PR body.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-vitest
          path: reports/vitest.xml
          retention-days: 14
      - name: Build
        run: npm run build
      - name: Bundle size
        run: node scripts/bundle-size.mjs dist >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      # Not cached: Playwright advises against it, and with a cache hit `playwright install-deps`
      # alone hung until the job timed out.
      - name: Install browsers and their system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end and accessibility tests (Chromium, Firefox, WebKit)
        run: npm run test:e2e
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-playwright
          path: reports/playwright.xml
          retention-days: 14
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results
            playwright-report
          retention-days: 14

  content-guard:
    name: content-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Scan for private names, franchise IP, addresses and internal hostnames
        env:
          CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}
        run: node scripts/content-guard.mjs

  container:
    # The self-hosted image (E0-09): build it, run it hardened, run the whole e2e suite and the
    # container tests against it, and build the multi-arch release image with attestations (no push).
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: btg:ci
          build-args: |
            REVISION=${{ github.sha }}
      - name: Build the multi-arch release image with SBOM and provenance (not pushed)
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max
          --output type=oci,dest=${{ runner.temp }}/btg-oci.tar .
      - name: Run it hardened
        run: |
          docker run -d --name btg -p 8080:8080 --read-only --tmpfs /tmp:rw,size=16m \
            --cap-drop=ALL --security-opt=no-new-privileges btg:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && exit 0; sleep 1; done
          docker logs btg; exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: e2e suite against the container
        env:
          CONTAINER: '1'
          BASE_URL: http://localhost:8080/
        # Everything but @tooling (tests of the test tooling, which need other browsers and say
        # nothing about the image).
        run: npx playwright test --project chromium --grep-invert @tooling
      - name: Container tests (size, user, hardening, headers, Trivy, release build)
        if: always()
        env:
          CONTAINER_IMAGE: btg:ci
          OCI_ARCHIVE: ${{ runner.temp }}/btg-oci.tar
        run: |
          mv reports/playwright.xml reports/playwright-container.xml || true
          npx vitest run --project repo tests/container
          mv reports/vitest.xml reports/vitest-container.xml
      - name: Save the image for the k8s job
        run: docker save btg:ci | gzip > ${{ runner.temp }}/btg.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/btg.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-container
          path: reports/*-container.xml
          retention-days: 14

  k8s:
    # E0-09.AC7: the example manifests on a real (kind) cluster.
    name: k8s
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - run: gunzip -c ${{ runner.temp }}/btg.tar.gz | docker load
      - uses: helm/kind-action@v1
        with:
          cluster_name: btg
      - run: kind load docker-image btg:ci --name btg
      - name: Apply deploy/k8s and test it
        env:
          K8S_IMAGE: btg:ci
        run: |
          npx vitest run --project repo tests/container/k8s.test.ts
          mv reports/vitest.xml reports/vitest-k8s.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-k8s
          path: reports/vitest-k8s.xml
          retention-days: 14

  gate:
    # Acceptance-criteria traceability (E0-10). On a PR, every criterion of each plan issue it closes
    # must be traced: an automated one by a tagged test that ran and passed in THIS run's JUnit
    # results, a manual one by evidence in docs/evidence/. Unknown tags always fail.
    name: gate
    needs: [verify, e2e, container, k8s]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tracer unit tests
        run: python3 -m unittest discover scripts/tests -v
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: reports
          merge-multiple: true
      - name: Committed matrix is current
        run: |
          python3 scripts/ac-trace.py --report /tmp/matrix.md > /dev/null
          if ! diff -u docs/plan/AC-TRACEABILITY.md /tmp/matrix.md; then
            echo "::error::docs/plan/AC-TRACEABILITY.md is stale. Run: python3 scripts/ac-trace.py --report docs/plan/AC-TRACEABILITY.md"
            exit 1
          fi
      - name: Plan issues this PR closes
        id: ids
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: echo "ids=$(python3 scripts/pr-issues.py)" >> "$GITHUB_OUTPUT"
      - name: Trace this PR's acceptance criteria against this run's results
        if: github.event_name == 'pull_request' && steps.ids.outputs.ids != ''
        run: python3 scripts/ac-trace.py --issue ${{ steps.ids.outputs.ids }} --junit reports/*.xml
      - name: Unknown tags (PR closes no plan issue)
        if: github.event_name != 'pull_request' || steps.ids.outputs.ids == ''
        run: python3 scripts/ac-trace.py --junit reports/*.xml
      - name: Publish the traceability matrix
        if: always()
        run: |
          python3 scripts/ac-trace.py --junit reports/*.xml --report matrix.md > /dev/null || true
          cat matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ac-traceability
          path: matrix.md
          retention-days: 30
