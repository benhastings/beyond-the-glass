name: ac-trace
# Gate: a PR that closes a plan issue must trace every acceptance criterion of that issue.
# E0-10 extends this to pass Vitest/Playwright JUnit reports via --junit once the app CI exists.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Find plan issues this PR closes
        id: ids
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, pathlib
          body = os.environ.get("BODY") or ""
          nums = {int(n) for n in re.findall(r"(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)", body)}
          m = pathlib.Path("docs/plan/issue-map.json")
          by_num = {v: k for k, v in json.loads(m.read_text()).items()} if m.exists() else {}
          ids = sorted(by_num[n] for n in nums if n in by_num and "-" in by_num[n])
          print("ids=" + " ".join(ids))
          PY
      - name: Trace acceptance criteria
        if: steps.ids.outputs.ids != ''
        run: python3 scripts/ac-trace.py --issue ${{ steps.ids.outputs.ids }}
      - name: No plan issue referenced
        if: steps.ids.outputs.ids == ''
        run: echo "PR does not close a plan issue; only unknown-tag hygiene is checked." && python3 scripts/ac-trace.py
