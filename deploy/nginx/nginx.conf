# nginx for the container image (E0-09). Runs as UID 101 with a read-only root filesystem: every path
# nginx writes is under /tmp, which is a tmpfs at runtime.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Redirects carry a path only, so they work behind port mappings, ingresses and proxies.
  absolute_redirect off;
  access_log /dev/stdout;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;

    # add_header in a location replaces the server's, so every location includes the same set.
    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
      return 200 "ok\n";
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    location = / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files /index.html =404;
    }

    # The app routes after the '#' (ADR-002). A path-style link such as /region/chartroom redirects to
    # /#/region/chartroom, keeping its query string.
    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri @hashroute;
    }
    location @hashroute {
      include /etc/nginx/security-headers.conf;
      return 302 /#$uri$is_args$args;
    }
  }
}
