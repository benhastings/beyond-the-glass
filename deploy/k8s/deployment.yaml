apiVersion: apps/v1
kind: Deployment
metadata:
  name: beyond-the-glass
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: beyond-the-glass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beyond-the-glass
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/benhastings/beyond-the-glass:latest
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # nginx's only writable path (pid file and temp dirs); the root filesystem is read-only.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
