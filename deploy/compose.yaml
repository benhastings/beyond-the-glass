# docker compose -f deploy/compose.yaml up
# Serves the app at http://localhost:8080/ with the same hardening as the CI smoke run.
services:
  beyond-the-glass:
    image: ghcr.io/benhastings/beyond-the-glass:latest
    build:
      context: ..
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
    restart: unless-stopped
