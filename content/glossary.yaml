# The Field Guide glossary. Entries are added by E2-05 and the curriculum issues; lessons link to them
# with <Term id="…"> or front-matter `terms`. Schema: src/content/schema.ts (glossaryFile).
terms:
  - id: pod
    term: Pod
    aliases: [pods]
    eli5: A box the cluster runs your program in. It can start, stop and move the box for you.
    operator: >-
      The smallest thing Kubernetes schedules: one or more containers that share an IP address and volumes,
      placed on a node and kept running by its kubelet. Where you'd have checked a process, you check its pod.
  - id: namespace
    term: Namespace
    aliases: [namespaces, ns]
    eli5: A folder in the cluster that keeps one team's things together.
    operator: >-
      A named group of objects in a cluster. Most commands work in one namespace at a time (-n), or across
      all of them (-A). Like separate host groups in your monitoring, but enforced by the cluster.
