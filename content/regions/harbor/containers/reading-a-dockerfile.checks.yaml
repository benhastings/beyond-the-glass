checks:
  - id: dockerfile-bug
    type: spot-the-bug
    required: true
    prompt: Which line means two builds of this Dockerfile, a week apart, might not start from the same image?
    explanation: FROM python:latest follows whatever latest points to on the day you build. Pin a version, or a digest.
    code: |
      FROM python:latest
      WORKDIR /app
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      COPY notifier/ ./notifier/
      USER 10001
      CMD ["python", "-m", "notifier"]
    bugLines: [1]
    lineFeedback:
      '3': Copying the library list first is good practice; it keeps the install layer cached.
      '4': The libraries come from the pinned list in requirements.txt, so this is repeatable.
      '6': Running as an ordinary user is safer than running as root.
  - id: dockerfile-order
    type: ordering
    prompt: Put these Dockerfile lines in the order that makes rebuilds fastest after a code change.
    explanation: What changes least goes first, so a code change rebuilds only the last layers.
    items:
      - id: from
        text: FROM registry.example/base/python:3.12-slim
      - id: reqs
        text: COPY requirements.txt .
      - id: install
        text: RUN pip install -r requirements.txt
      - id: code
        text: COPY notifier/ ./notifier/
  - id: dockerfile-logs
    type: single
    prompt: In the cluster, what takes the place of `docker logs CONTAINER`?
    explanation: kubectl logs prints what a pod's container wrote to its output.
    options:
      - id: describe
        text: kubectl describe pod
        feedback: describe shows the pod's state and events, not its output.
      - id: events
        text: kubectl get events
        feedback: Events are what the cluster did, not what the program wrote.
      - id: logs
        text: kubectl logs POD
        correct: true
