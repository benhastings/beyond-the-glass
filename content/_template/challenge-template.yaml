# A terminal challenge. Copy to src/challenges/<id>.yaml and add it to src/challenges/index.ts.
# Predicates and hints: docs/sim/challenges.md. CI runs `expertPath` to prove it can be solved.
id: challenge-template
title: Find the pod that isn't running
scenario: ravenpost
brief: >-
  List the pods in the ravenpost namespace and find the one that isn't Running. Then answer with its
  name (the start of the name is enough).
questions:
  - id: failing-pod
    prompt: Which pod isn't running?
objectives:
  - id: list-pods
    text: List the pods in the ravenpost namespace
    check:
      type: ranCommand
      pattern: '^kubectl\s+get\s+(po|pod|pods)\b.*(-n\s*ravenpost|--namespace[=\s]ravenpost|-A\b)'
  - id: name-it
    text: Name the pod that isn't running
    check:
      type: answered
      question: failing-pod
      matcher:
        resource:
          kind: Pod
          namespace: ravenpost
          where: { path: 'status.containerStatuses[0].ready', equals: 'false' }
hints:
  - level: nudge
    text: Pods live in namespaces. Which one does Ravenpost run in?
  - level: pointer
    text: '`kubectl get pods` lists pods, and `-n` picks the namespace. Look at the STATUS column.'
  - level: command
    text: 'Run `kubectl get pods -n ravenpost`, then `answer failing-pod <name>`.'
expertPath:
  - kubectl get pods -n ravenpost
  - answer failing-pod ravenpost-notifier
